name: Validate book

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "tools/validate-book.mjs"
      - "tools/run-capstones.py"
      - ".github/workflows/validate-book.yml"
  pull_request:
    paths:
      - "book/**"
      - "tools/validate-book.mjs"
      - "tools/run-capstones.py"
      - ".github/workflows/validate-book.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate book markdown (links, fences, mermaid, KaTeX, math, style)
        run: node tools/validate-book.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run every capstone code block (book/*/10-putting-it-together.md)
        run: python3 tools/run-capstones.py
