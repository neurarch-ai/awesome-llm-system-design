name: Validate book

on:
  # Manual trigger, so a green can be produced on demand. The path filters below are
  # correct and do skip this workflow on a change that touches neither book tree,
  # which is what happened on the merged part of PR #7; without a manual trigger
  # there was no way to tell that skip apart from a failure that never reported.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "book-zh/**"
      - "tools/validate-book.mjs"
      - "tools/run-capstones.py"
      - ".github/workflows/validate-book.yml"
  pull_request:
    paths:
      - "book/**"
      - "book-zh/**"
      - "tools/validate-book.mjs"
      - "tools/run-capstones.py"
      - ".github/workflows/validate-book.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate book markdown (links, fences, mermaid, KaTeX, math, style)
        run: node tools/validate-book.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run every capstone code block (book*/*/10-putting-it-together.md)
        run: python3 tools/run-capstones.py
